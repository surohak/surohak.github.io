<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="holographicGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#a78bfa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f472b6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background with holographic gradient -->
  <rect x="4" y="4" width="56" height="56" rx="12" ry="12" fill="url(#holographicGradient)"/>
  
  <!-- SH Initials -->
  <text x="32" y="42" font-family="'Outfit', 'Sora', -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">SH</text>
</svg>
