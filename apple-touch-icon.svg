<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4623a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d4845c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6a77f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background with gradient -->
  <rect x="20" y="20" width="140" height="140" rx="24" ry="24" fill="url(#accentGradient)"/>
  
  <!-- SH Initials -->
  <text x="90" y="115" font-family="'Sora', -apple-system, BlinkMacSystemFont, sans-serif" font-size="80" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="middle">SH</text>
</svg>

